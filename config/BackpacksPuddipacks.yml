# Puddipacks - custom backpacks for Smoothbrain Backpacks 1.3.9+
# Seven biome tiers. A new tier gives weight reduction. An upgrade gives slots.
# Each tier consumes the previous tier pack. Only one pack per inventory (unique: global).
# Requires "Use External YAML = On" in org.bepinex.plugins.backpacks.cfg.

# ==================================================================================================
# Tier 1 - Meadows
"Scrap Satchel":
  description: "Deer hide and scraps, stitched by a firelight. Holds a little, weighs the same. (8 to 12 slots, 0% weight reduction.)"
  size: 4x2
  unique: global
  appearance:
    BackpackBody: 8a6a4a
    BackpackFlap: 74563a
    PouchFront: hidden
    PouchLeft: hidden
    Knife: hidden
    Knifesheath: hidden
    Sleepbag: hidden
    BackpackStrapTop: hidden
    BackpackStrapBottom: hidden
    Pot: hidden
    ToolstrapTop: hidden
    ToolstrapBottom: hidden
    MetalclipLeft: hidden
    MetalclipFrontLeft: hidden
    MetalclipFrontRight: hidden
    RingBottomLeft: hidden
    Pickaxe: hidden
    Teapot: hidden
  crafting:
