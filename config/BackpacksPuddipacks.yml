# Puddipacks - custom backpacks for Smoothbrain Backpacks 1.3.9+
# Eight biome tiers. A new tier gives weight reduction. An upgrade gives slots.
# Each tier consumes the previous tier pack. One pack of each type per inventory (unique: type).
# 'global' would block crafting, because the previous pack in the inventory counts as a second backpack.
# Upgrades need Protection Idols (Upgrader0Armor .. Upgrader7Armor): 2 for 2 stars, 3 for 3 stars.
# Every recipe has at most 4 ingredients, the number the crafting window shows.
# Idols are loot from chests, one idol tier per biome.
# All packs allow teleport of their contents (teleport: true). Change to false to block ore teleport.
# Requires "Use External YAML = On" in org.bepinex.plugins.backpacks.cfg.

# ==================================================================================================
